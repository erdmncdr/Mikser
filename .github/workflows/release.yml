name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate tag and version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          plist_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [ "$tag" = "$version" ] || [ "$version" != "$plist_version" ]; then
            echo "Tag $tag must match Info.plist version $plist_version (for example v$plist_version)." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build application bundle
        run: ./build.sh

      - name: Verify application bundle
        run: codesign --verify --deep --strict --verbose=2 build/Mikser.app

      - name: Package application bundle
        id: archive
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/mikser-release"
          mkdir -p "$release_dir"
          archive="Mikser-$RELEASE_VERSION.zip"
          ditto -c -k --sequesterRsrc --keepParent build/Mikser.app "$release_dir/$archive"
          echo "directory=$release_dir" >> "$GITHUB_OUTPUT"
          echo "name=$archive" >> "$GITHUB_OUTPUT"

      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_DIR: ${{ steps.archive.outputs.directory }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "The SPARKLE_PRIVATE_KEY repository secret is missing." >&2
            exit 1
          fi
          generator=".build/artifacts/sparkle/Sparkle/bin/generate_appcast"
          test -x "$generator"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$generator" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/erdmncdr/Mikser/releases/download/$RELEASE_TAG/" \
            --link "https://github.com/erdmncdr/Mikser" \
            --maximum-versions 1 \
            "$RELEASE_DIR"
          test -s "$RELEASE_DIR/appcast.xml"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_DIR: ${{ steps.archive.outputs.directory }}
          ARCHIVE_NAME: ${{ steps.archive.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "$RELEASE_DIR/$ARCHIVE_NAME" \
            "$RELEASE_DIR/appcast.xml" \
            --title "Mikser $RELEASE_VERSION" \
            --notes-file .github/release-notes-header.md \
            --generate-notes
