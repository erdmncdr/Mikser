name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build application bundle
        run: ./build.sh
      - name: Package application bundle
        run: ditto -c -k --sequesterRsrc --keepParent build/Mikser.app Mikser.zip
      - name: Verify application bundle
        run: |
          codesign --verify --deep --strict --verbose=2 build/Mikser.app
          test "$(otool -L build/Mikser.app/Contents/MacOS/Mikser | grep -c '@rpath/Sparkle.framework')" -eq 1
      - name: Upload application bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Mikser-macOS
          path: Mikser.zip
          if-no-files-found: error
